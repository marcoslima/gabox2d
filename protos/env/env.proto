syntax="proto3";

package Env.v1;

message vec2f {
  float x = 1;
  float y = 2;
}

message env_data {
  float tlx = 1;
  float tly = 2;
  float brx = 3;
  float bry = 4;
  repeated vec2f ground = 5;
}

message env {
  int32 seed = 1;
  float dxm = 2;
  float dxs = 3;
  float dxo = 4;
  float dym = 5;
  float dys = 6;
  float dyo = 7;
  float phi = 8;
  float omega = 9;
  float a = 10;
  env_data data = 11;
}
